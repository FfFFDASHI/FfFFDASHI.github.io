# 网站全局背景图（基德）
background: /img/jide.jpg
footer_img: transparent
inject:
  head:
    - |
      <style>
        body { cursor: url('/img/cursor.png') 16 16, auto; }
        a, button, input { cursor: url('/img/cursor-hover.png') 16 16, pointer; }
      </style>
  bottom:
    - |
      <script>
        (function () {
          if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return;
          var marks = ['✦', '♢', '❖', '◆'];
          var last = 0;
          document.addEventListener('mousemove', function (e) {
            var now = Date.now();
            if (now - last < 70) return;
            last = now;
            var s = document.createElement('span');
            s.textContent = marks[Math.floor(Math.random() * marks.length)];
            s.style.cssText = 'position:fixed;left:' + e.clientX + 'px;top:' + e.clientY + 'px;pointer-events:none;z-index:99999;color:#49b1f5;text-shadow:0 0 6px rgba(73,177,245,.9);font-size:' + (11 + Math.random() * 9) + 'px;transform:translate(-50%,-50%);transition:transform 1.1s ease-out,opacity 1.1s ease-out;';
            document.body.appendChild(s);
            requestAnimationFrame(function () {
              s.style.opacity = '0';
              s.style.transform = 'translate(' + (-50 + (Math.random() * 60 - 30)) + '%,' + (-40 + Math.random() * 50) + '%) scale(.4) rotate(' + (Math.random() * 120 - 60) + 'deg)';
            });
            setTimeout(function () { s.remove(); }, 1150);
          });
        })();
      </script>
