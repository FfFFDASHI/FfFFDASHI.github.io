# 网站全局背景图（基德）
background: /img/jide.jpg
footer_img: transparent

inject:
  head:
    - |
      <style>
        body { cursor: url('/img/cursor.png') 8 8, auto; }
        a, button, input { cursor: url('/img/cursor-hover.png') 8 8, pointer; }
        .kd-trail {
          position: fixed;
          pointer-events: none;
          z-index: 99999;
          animation: kd-float 1.1s ease-out forwards;
        }
        @keyframes kd-float {
          0% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0deg); }
          100% { opacity: 0; transform: translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,45px))) scale(.35) rotate(var(--rot,60deg)); }
        }
      </style>
  bottom:
    - |
      <script>
        (function () {
          if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return;
          var marks = ['✦', '♢', '❖', '◆'];
          var last = 0;
          document.addEventListener('mousemove', function (e) {
            var now = Date.now();
            if (now - last < 70) return;
            last = now;
            var s = document.createElement('span');
            s.className = 'kd-trail';
            s.textContent = marks[Math.floor(Math.random() * marks.length)];
            s.style.left = e.clientX + 'px';
            s.style.top = e.clientY + 'px';
            s.style.color = '#49b1f5';
            s.style.textShadow = '0 0 6px rgba(73,177,245,.9)';
            s.style.fontSize = (11 + Math.random() * 9) + 'px';
            s.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
            s.style.setProperty('--dy', (30 + Math.random() * 50) + 'px');
            s.style.setProperty('--rot', (Math.random() * 120 - 60) + 'deg');
            document.body.appendChild(s);
            setTimeout(function () { s.remove(); }, 1150);
          });
        })();
      </script>

